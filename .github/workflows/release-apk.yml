# Builds the release APK and uploads it to Supabase Storage (bucket rider-app-releases) when a version tag is pushed:
#   git tag v1.2.3 && git push origin v1.2.3        (the tag must match the version in pubspec.yaml)
# Or run it by hand from the Actions tab (workflow_dispatch).
#
# Secrets to add in GitHub > Settings > Secrets and variables > Actions:
#   SUPABASE_URL                  https://qaolnxcmmomyhftheknr.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY     service-role key (storage upload only; never shipped in the app)
#   ANDROID_DEBUG_KEYSTORE_B64    base64 of ~/.android/debug.keystore (this app is signed with it, so an update installs over
#                                 an existing install only if the same key is used)
name: Release APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-apk
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2.18.0
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true

      - name: Check the tag matches pubspec.yaml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          V=$(grep -m1 '^version:' pubspec.yaml | sed -E 's/version:\s*([0-9.]+)\+.*/\1/')
          if [ "v$V" != "${GITHUB_REF_NAME}" ]; then echo "Tag ${GITHUB_REF_NAME} does not match pubspec version v$V"; exit 1; fi

      - name: Restore the signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "ANDROID_DEBUG_KEYSTORE_B64 is not set"; exit 1; fi
          mkdir -p ~/.android
          echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: if [ -d test ]; then flutter test; else echo "no tests"; fi
      - run: flutter build apk --release --target-platform android-arm64

      - uses: actions/upload-artifact@v4.6.2
        with:
          name: apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload to Supabase Storage
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NOTES: ${{ github.ref_name }}
        run: node tools/upload-apk.mjs --apk build/app/outputs/flutter-apk/app-release.apk --app rider --bucket rider-app-releases --manifest true --notes "$NOTES"
